<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>每日攒量</title>
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#f5f6fa;--card:#fff;--text:#1a1d26;--sub:#8a8f9c;--up:#22b573;--down:#f2545b;--line:#eef0f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:18px 14px 40px}
  .wrap{max-width:520px;margin:0 auto}
  .head{padding:2px 4px 16px}
  .head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.5px}
  .today{font-size:12px;color:var(--sub);margin-top:5px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,25,50,.05),0 8px 24px -12px rgba(20,25,50,.14)}
  .card-title{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:12px}
  .input-row{display:flex;align-items:center;gap:10px}
  #numInput{flex:1;min-width:0;border:none;background:#f3f5fb;border-radius:12px;padding:14px 16px;font-size:24px;font-weight:700;color:var(--text);outline:none;font-family:inherit}
  #numInput::placeholder{color:#c2c7d4;font-weight:500}
  #numInput:focus{background:#eef1fa;box-shadow:0 0 0 2px rgba(91,124,250,.25)}
  #numInput::-webkit-outer-spin-button,#numInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #numInput{-moz-appearance:textfield;appearance:textfield}
  #saveBtn{border:none;background:linear-gradient(135deg,#6b8bff,#5b7cfa);color:#fff;font-size:15px;font-weight:600;padding:16px 22px;border-radius:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
  #saveBtn:active{transform:scale(.96)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,25,50,.05),0 8px 24px -12px rgba(20,25,50,.14)}
  .stat-val{font-size:19px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-label{font-size:11px;color:var(--sub);margin-top:5px}
  .up{color:var(--up)} .down{color:var(--down)}
  .chart{display:flex;gap:4px;height:150px}
  .bar-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .bar-track{position:relative;flex:1;width:100%}
  .bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:68%;max-width:20px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#8aa4ff,#5b7cfa);transition:height .35s ease}
  .bar.is-today{background:linear-gradient(180deg,#ffb36b,#ff8a3d)}
  .bar-empty{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:68%;max-width:20px;height:3px;border-radius:2px;background:#e4e8f2}
  .tip{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#1a1d26;color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap;opacity:0;transition:.15s;pointer-events:none;z-index:2}
  .bar-col:hover .tip,.bar-col:active .tip{opacity:1}
  .bar-day{font-size:9px;color:var(--sub);height:16px;line-height:16px;text-align:center}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row-date{font-size:14px;font-weight:500}
  .row-sub{font-size:11px;color:var(--sub);margin-top:3px}
  .row-val{margin-left:auto;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .del{width:26px;height:26px;border-radius:50%;border:none;background:#f3f5fb;color:#9aa0ae;font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
  .del:active{background:#e6e9f3}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
  .tools{display:flex;gap:10px;margin-top:4px}
  .tools button,.file-label{flex:1;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
  .tools button:active,.file-label:active{background:#eef0f7}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>每日攒量</h1>
    <div class="today" id="todayLabel"></div>
  </div>
  <div class="card">
    <div class="card-title">今天攒了多少</div>
    <div class="input-row">
      <input id="numInput" type="number" inputmode="decimal" step="any" placeholder="0">
      <button id="saveBtn">保存</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-label">累计</div></div>
    <div class="stat"><div class="stat-val" id="statDelta">—</div><div class="stat-label">较昨日</div></div>
    <div class="stat"><div class="stat-val" id="statStreak">0</div><div class="stat-label">连续天数</div></div>
  </div>
  <div class="card">
    <div class="card-title">最近 14 天</div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="card">
    <div class="card-title">全部记录</div>
    <div id="list"></div>
  </div>
  <div class="tools">
    <button id="exportBtn">导出数据</button>
    <label class="file-label">导入数据<input type="file" id="importInput" accept="application/json,.json" hidden></label>
  </div>
</div>
<script>
(function(){
  'use strict';
  var KEY='daily-count-v1';
  var records={};
  try{
    var raw=JSON.parse(localStorage.getItem(KEY));
    if(raw&&typeof raw==='object'&&!Array.isArray(raw))records=raw;
  }catch(e){records={};}
  var $=function(id){return document.getElementById(id);};
  var WEEK=['周日','周一','周二','周三','周四','周五','周六'];
  function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function todayKey(){return keyOf(new Date());}
  function parseKey(k){var p=k.split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
  function shiftKey(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
  function fmt(n){var num=Number(n);if(!isFinite(num))return '—';return num.toLocaleString('zh-CN',{maximumFractionDigits:2});}
  function labelOf(k){
    var d=parseKey(k),prefix='';
    if(k===todayKey())prefix='今天 · ';
    else if(k===shiftKey(todayKey(),-1))prefix='昨天 · ';
    return prefix+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK[d.getDay()];
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){alert('保存失败');}}
  function render(){
    var tKey=todayKey(),now=new Date();
    $('todayLabel').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+WEEK[now.getDay()];
    var total=0;
    Object.keys(records).forEach(function(k){total+=Number(records[k])||0;});
    $('statTotal').textContent=fmt(total);
    var tv=records[tKey],yv=records[shiftKey(tKey,-1)],dEl=$('statDelta');
    if(tv===undefined||yv===undefined){dEl.textContent='—';dEl.className='stat-val';}
    else{
      var diff=Number(tv)-Number(yv);
      if(diff>0){dEl.textContent='↑'+fmt(diff);dEl.className='stat-val up';}
      else if(diff<0){dEl.textContent='↓'+fmt(Math.abs(diff));dEl.className='stat-val down';}
      else{dEl.textContent='持平';dEl.className='stat-val';}
    }
    $('statStreak').textContent=streak();
    var input=$('numInput');
    if(document.activeElement!==input){input.value=(tv===undefined)?'':tv;}
    $('saveBtn').textContent=(tv===undefined)?'保存':'更新';
    renderChart();renderList();
  }
  function streak(){
    var count=0,d=new Date();
    if(records[keyOf(d)]===undefined)d.setDate(d.getDate()-1);
    while(records[keyOf(d)]!==undefined){count++;d.setDate(d.getDate()-1);}
    return count;
  }
  function renderChart(){
    var box=$('chart'),now=new Date(),tKey=todayKey(),days=[];
    for(var i=13;i>=0;i--){
      var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),k=keyOf(d);
      days.push({k:k,d:d,v:records[k]});
    }
    var max=1;
    days.forEach(function(x){if(x.v!==undefined)max=Math.max(max,Number(x.v));});
    box.innerHTML=days.map(function(x){
      var has=x.v!==undefined,h=has?Math.max(4,(Number(x.v)/max)*100):0;
      var barHtml=has
        ?'<div class="bar'+(x.k===tKey?' is-today':'')+'" style="height:'+h+'%"></div><div class="tip">'+fmt(x.v)+'</div>'
        :'<div class="bar-empty"></div>';
      return '<div class="bar-col"><div class="bar-track">'+barHtml+'</div><div class="bar-day">'+x.d.getDate()+'</div></div>';
    }).join('');
  }
  function renderList(){
    var box=$('list'),keys=Object.keys(records).sort().reverse();
    if(!keys.length){box.innerHTML='<div class="empty">还没有记录，从今天开始吧 ✨</div>';return;}
    box.innerHTML=keys.map(function(k){
      var v=Number(records[k]),pv=records[shiftKey(k,-1)],sub;
      if(pv===undefined){sub='<span style="color:#b9bec9">—</span>';}
      else{
        var diff=v-Number(pv);
        if(diff>0)sub='<span class="up">↑ '+fmt(diff)+'</span>';
        else if(diff<0)sub='<span class="down">↓ '+fmt(Math.abs(diff))+'</span>';
        else sub='<span style="color:#b9bec9">持平</span>';
      }
      return '<div class="row"><div><div class="row-date">'+labelOf(k)+'</div><div class="row-sub">'+sub+'</div></div><div class="row-val">'+fmt(v)+'</div><button class="del" data-del="'+k+'">×</button></div>';
    }).join('');
  }
  $('saveBtn').addEventListener('click',function(){
    var raw=$('numInput').value.trim(),v=Number(raw);
    if(raw===''||!isFinite(v)||v<0){$('numInput').focus();return;}
    records[todayKey()]=v;persist();$('numInput').blur();render();
    $('saveBtn').textContent='已保存 ✓';setTimeout(render,900);
  });
  $('numInput').addEventListener('keydown',function(e){if(e.key==='Enter')$('saveBtn').click();});
  $('list').addEventListener('click',function(e){
    var btn=e.target.closest('[data-del]');if(!btn)return;
    var k=btn.getAttribute('data-del');
    if(confirm('删除 '+labelOf(k)+' 的记录？')){delete records[k];persist();render();}
  });
  $('exportBtn').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='每日攒量-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  });
  $('importInput').addEventListener('change',function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      var data,clean={};
      try{
        data=JSON.parse(reader.result);
        if(!data||typeof data!=='object'||Array.isArray(data))throw new Error();
        Object.keys(data).forEach(function(k){
          var v=Number(data[k]);
          if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&isFinite(v)&&v>=0)clean[k]=v;
        });
      }catch(err){alert('文件格式不正确');e.target.value='';return;}
      if(!Object.keys(clean).length){alert('没有有效记录');e.target.value='';return;}
      if(confirm('合并 '+Object.keys(clean).length+' 条记录？同一天以导入为准')){
        Object.keys(clean).forEach(function(k){records[k]=clean[k];});
        persist();render();
      }
      e.target.value='';
    };
    reader.readAsText(file);
  });
  render();
})();
</script>
</body>
  </html>
